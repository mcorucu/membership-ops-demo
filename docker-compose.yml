services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: membership_ops
      POSTGRES_USER: membership_ops
      POSTGRES_PASSWORD: membership_ops_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - membership_ops_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U membership_ops -d membership_ops"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  membership_ops_postgres:
