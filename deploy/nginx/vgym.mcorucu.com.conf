# Add this file to the existing shared Nginx conf.d directory only after
# the vgym.mcorucu.com certificate has been issued.
server {
  listen 80;
  server_name vgym.mcorucu.com;
  return 301 https://vgym.mcorucu.com$request_uri;
}

server {
  listen 443 ssl http2;
  server_name vgym.mcorucu.com;

  ssl_certificate /etc/letsencrypt/live/vgym.mcorucu.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/vgym.mcorucu.com/privkey.pem;

  location /api/ {
    proxy_pass http://vgym-membership-api:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $http_x_request_id;
    proxy_no_cache 1;
    add_header Cache-Control "no-store" always;
  }

  location / {
    proxy_pass http://vgym-membership-web:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
