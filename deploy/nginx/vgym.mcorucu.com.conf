# Euronodes shared-proxy vhost for Membership Ops.
# Install only after the Euronodes certificate exists at the paths below.
server {
  listen 80;
  server_name vgym.mcorucu.com;
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    try_files $uri =404;
  }
  location / {
    return 301 https://vgym.mcorucu.com$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name vgym.mcorucu.com;

  ssl_certificate /etc/nginx/certs/letsencrypt/live/vgym.mcorucu.com/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/letsencrypt/live/vgym.mcorucu.com/privkey.pem;

  add_header Strict-Transport-Security "max-age=86400" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;

  location /api/ {
    proxy_pass http://vgym-membership-api:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $http_x_request_id;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    add_header Cache-Control "no-store" always;
  }

  location / {
    proxy_pass http://vgym-membership-web:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
